<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vencimientos Fadentix S.A.</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#171b25;--bg3:#1e2330;--bg4:#252b3b;--border:#2a3045;--border2:#344060;--accent:#4f8ef7;--accent2:#3a6fd4;--green:#3ecf8e;--red:#f55;--yellow:#f7c948;--orange:#f59e42;--purple:#a78bfa;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--radius:6px;--shadow:0 4px 24px rgba(0,0,0,.4);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;text-align:center}
.login-box h1{color:var(--accent);font-size:28px;margin-bottom:6px}
.login-box p{color:var(--text2);margin-bottom:28px;font-size:14px}
.login-box label{display:block;text-align:left;font-size:12px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.login-box input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);margin-bottom:16px;font-size:14px}
.login-box input:focus{outline:none;border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;margin-top:8px}
.login-btn:hover{background:var(--accent2)}
.login-err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
#app{display:none;width:100%;min-height:100vh}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo h2{color:var(--accent);font-size:15px;font-weight:700}
.sidebar-logo p{color:var(--text3);font-size:11px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text2);font-size:13px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.user-info{font-size:12px;color:var(--text3)}
.user-info strong{color:var(--text2);display:block}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);font-size:12px}
.logout-btn:hover{background:var(--bg4)}
.main{margin-left:220px;flex:1;padding:28px;min-height:100vh}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700}
.btn{padding:9px 18px;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg4);color:var(--text)}
.btn-danger{background:rgba(255,85,85,.15);color:var(--red);border:1px solid rgba(255,85,85,.3)}
.btn-success{background:rgba(62,207,142,.15);color:var(--green);border:1px solid rgba(62,207,142,.3)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:18px}
.stat-val{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-lbl{font-size:12px;color:var(--text2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--bg3)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-red{background:rgba(255,85,85,.15);color:var(--red)}
.badge-yellow{background:rgba(247,201,72,.15);color:var(--yellow)}
.badge-green{background:rgba(62,207,142,.15);color:var(--green)}
.badge-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.badge-orange{background:rgba(245,158,66,.15);color:var(--orange)}
.badge-gray{background:rgba(100,116,139,.15);color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-lg{max-width:760px}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text3);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.alert-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px}
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.row-vencido td:first-child{border-left:3px solid var(--red)}
.row-hoy td:first-child{border-left:3px solid var(--yellow)}
.row-proximo td:first-child{border-left:3px solid var(--orange)}
.row-ok td:first-child{border-left:3px solid var(--green)}
.row-proceso td:first-child{border-left:3px solid var(--purple)}
.row-pagado td:first-child{border-left:3px solid var(--text3)}
.lote-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.lote-row:last-child{border-bottom:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Vencimientos</h1>
    <p>Fadentix S.A. — Sistema de gestión de vencimientos</p>
    <label>USUARIO</label>
    <input id="loginUser" type="text" placeholder="usuario" autocomplete="username">
    <label>CONTRASEÑA</label>
    <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <p id="loginErr" class="login-err"></p>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2>📅 Vencimientos</h2>
      <p id="sidebarEmpresa">Fadentix S.A.</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" onclick="showView('agenda')" data-view="agenda"><span class="icon">📋</span>Agenda</div>
      <div class="nav-item" onclick="showView('alertas')" data-view="alertas"><span class="icon">🔔</span>Alertas<span id="alertBadge"></span></div>
      <div class="nav-item" onclick="showView('lotes')" data-view="lotes"><span class="icon">📦</span>Lotes</div>
      <div class="nav-item" onclick="showView('historial')" data-view="historial"><span class="icon">📜</span>Historial</div>
      <div class="nav-item" onclick="showView('envios')" data-view="envios"><span class="icon">📤</span>Envíos</div>
      <div class="nav-item" onclick="showView('rubros')" data-view="rubros"><span class="icon">🏷️</span>Rubros</div>
      <div class="nav-item" onclick="showView('proveedores')" data-view="proveedores"><span class="icon">🏢</span>Proveedores</div>
      <div class="nav-item" onclick="showView('contactos')" data-view="contactos"><span class="icon">👥</span>Contactos</div>
      <div class="nav-item" onclick="showView('funcionarios')" data-view="funcionarios"><span class="icon">👤</span>Funcionarios</div>
      <div class="nav-item" onclick="showView('estadisticas')" data-view="estadisticas"><span class="icon">📊</span>Estadísticas</div>
      <div class="nav-item" onclick="showView('usuarios')" data-view="usuarios"><span class="icon">🔑</span>Usuarios</div>
      <div class="nav-item" onclick="showView('config')" data-view="config"><span class="icon">⚙️</span>Configuración</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><strong id="sidebarUser">—</strong>Conectado</div>
      <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<div id="modalContainer"></div>

<script>
const SUPABASE_URL = 'https://jqsnoqkpositwbvwmwfs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8fvUygmviuzdM80XcUOT7g_1zYT2dSq';
let sbClient = null;
let realtimeChannel = null;
let DB = {};
let currentUser = null;
let currentView = 'agenda';
let activeRubros = [];

function initSupabase() {
  try { sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.warn(e); }
}

function ensureDefaults() {
  if (!DB.vencimientos) DB.vencimientos = [];
  if (!DB.rubros) DB.rubros = [
    {id:'r1',nombre:'Impuestos',emoji:'💰',color:'#f7c948',tipo:'impuesto',diasAlerta:10},
    {id:'r2',nombre:'Servicios',emoji:'⚡',color:'#4f8ef7',tipo:'servicio',diasAlerta:5},
    {id:'r3',nombre:'Alquileres',emoji:'🏠',color:'#3ecf8e',tipo:'alquiler',diasAlerta:7},
    {id:'r4',nombre:'Seguros',emoji:'🛡️',color:'#a78bfa',tipo:'seguro',diasAlerta:15},
    {id:'r5',nombre:'Sueldos',emoji:'👷',color:'#f59e42',tipo:'rrhh',diasAlerta:3},
    {id:'r6',nombre:'Proveedores',emoji:'🏢',color:'#f55',tipo:'proveedor',diasAlerta:5},
  ];
  if (!DB.proveedores) DB.proveedores = [];
  if (!DB.contactos) DB.contactos = [];
  if (!DB.funcionarios) DB.funcionarios = [];
  if (!DB.usuarios) DB.usuarios = [
    {id:'u1',nombre:'Administrador',usuario:'admin',password:'admin123',rol:'admin'},
    {id:'u2',nombre:'Operador',usuario:'operador',password:'op123',rol:'operador'},
  ];
  if (!DB.historial) DB.historial = [];
  if (!DB.config) DB.config = {diasAlerta:5,empresa:'Fadentix S.A.'};
  if (!DB.lotes) DB.lotes = [];
}

async function loadFromCloud() {
  if (!sbClient) return;
  try {
    const {data,error} = await sbClient.from('vm_data').select('*');
    if (error) throw error;
    if (data && data.length > 0) data.forEach(row => { DB[row.key] = row.value; });
  } catch(e) { console.warn('Cloud load:', e); }
}

async function saveToCloud(key) {
  if (!sbClient) return;
  try { await sbClient.from('vm_data').upsert({key, value: DB[key]}); } catch(e) { console.warn(e); }
}

function setupRealtime() {
  if (!sbClient || realtimeChannel) return;
  realtimeChannel = sbClient.channel('vm_changes')
    .on('postgres_changes', {event:'*',schema:'public',table:'vm_data'}, payload => {
      if (payload.new?.key) { DB[payload.new.key] = payload.new.value; renderCurrent(); updateAlertBadge(); }
    }).subscribe();
}

function saveLocal() { try { localStorage.setItem('fadentix_db', JSON.stringify(DB)); } catch(e){} }
function loadLocal() { try { const d=localStorage.getItem('fadentix_db'); if(d) DB=JSON.parse(d); } catch(e){} }

async function saveDB(key) { saveLocal(); await saveToCloud(key); }

// AUTH
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const defaults = [
    {id:'u1',nombre:'Administrador',usuario:'admin',password:'admin123',rol:'admin'},
    {id:'u2',nombre:'Operador',usuario:'operador',password:'op123',rol:'operador'}
  ];
  let found = defaults.find(x => x.usuario===u && x.password===p);
  if (!found) found = (DB.usuarios||[]).find(x => x.usuario===u && x.password===p);
  if (found) {
    currentUser = found;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('sidebarUser').textContent = found.nombre;
    document.getElementById('sidebarEmpresa').textContent = DB.config?.empresa || 'Fadentix S.A.';
    showView('agenda');
    updateAlertBadge();
    setupRealtime();
  } else {
    document.getElementById('loginErr').textContent = 'Usuario o contraseña incorrectos.';
  }
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.getElementById('loginScreen').style.display!=='none') doLogin();
});

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').textContent = '';
  if (realtimeChannel && sbClient) { sbClient.removeChannel(realtimeChannel); realtimeChannel = null; }
}

function showView(v) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view===v));
  renderCurrent();
}

function renderCurrent() {
  const map = {agenda:renderAgenda,alertas:renderAlertas,lotes:renderLotes,historial:renderHistorial,envios:renderEnvios,rubros:renderRubros,proveedores:renderProveedores,contactos:renderContactos,funcionarios:renderFuncionarios,estadisticas:renderEstadisticas,usuarios:renderUsuarios,config:renderConfig};
  if (map[currentView]) map[currentView]();
}

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function formatDate(d) { if(!d)return'—'; const[y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function diasHasta(fecha) { if(!fecha)return null; const hoy=new Date();hoy.setHours(0,0,0,0); return Math.round((new Date(fecha+'T00:00:00')-hoy)/86400000); }

function getEstado(v) {
  if (v.estado==='pagado') return 'pagado';
  if (v.estado==='proceso') return 'proceso';
  if (!v.fecha) return 'ok';
  const d = diasHasta(v.fecha);
  if (d<0) return 'vencido';
  if (d===0) return 'hoy';
  if (d<=(DB.config?.diasAlerta||5)) return 'proximo';
  return 'ok';
}

function estadoBadge(v) {
  const e=getEstado(v);
  const map={vencido:['badge-red','Vencido'],hoy:['badge-yellow','Hoy'],proximo:['badge-orange','Próximo'],ok:['badge-green','Al día'],proceso:['badge-blue','En gestión'],pagado:['badge-gray','Pagado']};
  const[cls,lbl]=map[e]||['badge-gray','—'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}
function rowClass(v) { return `row-${getEstado(v)}`; }
function getRubro(id) { return DB.rubros?.find(r=>r.id===id)||null; }
function getProveedor(id) { return DB.proveedores?.find(p=>p.id===id)||null; }

function updateAlertBadge() {
  const alerta=DB.config?.diasAlerta||5;
  const cnt=(DB.vencimientos||[]).filter(v=>{ if(v.estado==='pagado'||v.estado==='proceso')return false; const d=diasHasta(v.fecha); return d!==null&&d<=alerta; }).length;
  const el=document.getElementById('alertBadge');
  if(el) el.innerHTML=cnt>0?`<span class="alert-dot"></span>`:'';
}

function openModal(html) { document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="closeModalIfOut(event)">${html}</div>`; }
function closeModal() { document.getElementById('modalContainer').innerHTML=''; }
function closeModalIfOut(e) { if(e.target.classList.contains('modal-overlay'))closeModal(); }
function confirmDelete(msg,fn) {
  openModal(`<div class="modal" style="max-width:380px"><div class="modal-header"><h3>Confirmar</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><p style="color:var(--text2)">${msg}</p></div><div class="modal-footer"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-danger btn-sm" onclick="closeModal();(${fn})()">Eliminar</button></div></div>`);
}

// AGENDA
function renderAgenda() {
  const mc=document.getElementById('mainContent');
  const venc=DB.vencimientos||[];
  const hoyC=venc.filter(v=>getEstado(v)==='hoy').length;
  const vencC=venc.filter(v=>getEstado(v)==='vencido').length;
  const proxC=venc.filter(v=>getEstado(v)==='proximo').length;
  const pagC=venc.filter(v=>getEstado(v)==='pagado').length;
  let filtered=[...venc];
  if(activeRubros.length>0) filtered=filtered.filter(v=>activeRubros.includes(v.rubroId));
  const orden={vencido:0,hoy:1,proximo:2,proceso:3,ok:4,pagado:5};
  filtered.sort((a,b)=>(orden[getEstado(a)]||4)-(orden[getEstado(b)]||4));
  const rubrosChips=(DB.rubros||[]).map(r=>`<span class="chip ${activeRubros.includes(r.id)?'active':''}" onclick="toggleRubroFilter('${r.id}')">${r.emoji||''} ${r.nombre}</span>`).join('');
  mc.innerHTML=`<div class="page-header"><div class="page-title">📋 Agenda de Vencimientos</div><button class="btn btn-primary" onclick="openFormVenc()">+ Nuevo</button></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" style="color:var(--yellow)">${hoyC}</div><div class="stat-lbl">Vencen hoy</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">${vencC}</div><div class="stat-lbl">Vencidos</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${proxC}</div><div class="stat-lbl">Próximos</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--green)">${pagC}</div><div class="stat-lbl">Pagados</div></div>
  </div>
  <div class="card">
    <div class="filter-chips"><span class="chip ${activeRubros.length===0?'active':''}" onclick="clearRubroFilter()">Todos</span>${rubrosChips}</div>
    ${filtered.length===0?'<div class="empty-state"><div class="icon">📭</div><p>No hay vencimientos</p></div>':
    `<table><thead><tr><th>Concepto</th><th>Rubro</th><th>Proveedor</th><th>Fecha</th><th>Importe</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
    ${filtered.map(v=>{
      const r=getRubro(v.rubroId);const p=getProveedor(v.proveedorId);const d=diasHasta(v.fecha);
      const diasText=v.estado==='pagado'?'':d===null?'':d===0?'<br><small style="color:var(--yellow)">hoy</small>':d<0?`<br><small style="color:var(--red)">${Math.abs(d)}d atrás</small>`:`<br><small style="color:var(--text3)">${d}d</small>`;
      return `<tr class="${rowClass(v)}"><td><strong>${v.concepto||'—'}</strong>${v.nroDoc?`<br><small style="color:var(--text3)">${v.nroDoc}</small>`:''}</td>
      <td>${r?`<span style="color:${r.color||'#fff'}">${r.emoji||''} ${r.nombre}</span>`:'—'}</td>

  </tbody></table>`}</div>`;

function enviarAlertaContacto(cid) {
  const c=DB.contactos?.find(x=>x.id===cid);if(!c||!c.whatsapp){alert('Sin número de WhatsApp');return;}
  const alerta=DB.config?.diasAlerta||5;
  const proximos=(DB.vencimientos||[]).filter(v=>{const d=diasHasta(v.fecha);return d!==null&&d<=alerta&&v.estado!=='pagado';});
  let msg=`Hola ${c.nombre}! Recordatorio de vencimientos:\n\n`;
  proximos.forEach(v=>{const d=diasHasta(v.fecha);msg+=`• ${v.concepto} — ${formatDate(v.fecha)} (${d<0?`${Math.abs(d)}d vencido`:d===0?'HOY':`${d}d`})\n`;});
  if(!proximos.length)msg+='No hay vencimientos próximos.';
  enviarWA(c.whatsapp,msg);
}

function enviarWA(num,msg) {
  let n=num.toString().replace(/\D/g,'');
  if(n.startsWith('0'))n='598'+n.slice(1);else if(!n.startsWith('598')&&n.length<=9)n='598'+n;
  try{navigator.clipboard.writeText(msg);}catch(e){}
  window.open(`https://web.whatsapp.com/send?phone=${n}&text=${encodeURIComponent(msg)}`,'_self');
}

  const obj={id:id||uid(),nombre,cargo:document.getElementById('cCargo').value.trim(),whatsapp:document.getElementById('cWA').value.trim(),email:document.getElementById('cEmail').value.trim(),notas:document.getElementById('cNotas').value.trim()};
  if(id){const i=DB.contactos.findIndex(x=>x.id===id);if(i>=0)DB.contactos[i]=obj;}else DB.contactos.push(obj);

// LOTES
function renderLotes() {
  const mc=document.getElementById('mainContent');const lotes=DB.lotes||[];
  mc.innerHTML=`<div class="page-header"><div class="page-title">📦 Lotes</div><button class="btn btn-primary" onclick="openFormLote()">+ Nuevo lote</button></div>
  <p style="color:var(--text2);font-size:13px;margin-bottom:20px">Plantillas de vencimientos que podés aplicar mes a mes.</p>
  ${lotes.length===0?'<div class="empty-state"><div class="icon">📦</div><p>Sin lotes</p></div>':
  lotes.map(l=>`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div><strong>${l.nombre}</strong> <span style="color:var(--text3);font-size:12px">(${(l.items||[]).length} ítems)</span></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="aplicarLote('${l.id}')">▶ Aplicar</button><button class="btn btn-secondary btn-sm" onclick="openFormLote('${l.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteLote('${l.id}')">🗑️</button></div>
  </div>
  <table><thead><tr><th>Concepto</th><th>Proveedor</th><th>Rubro</th><th>Importe</th></tr></thead><tbody>
  ${(l.items||[]).map(it=>{const p=getProveedor(it.proveedorId);const r=getRubro(it.rubroId);return`<tr><td>${it.concepto}</td><td>${p?p.nombre:'—'}</td><td>${r?`${r.emoji} ${r.nombre}`:'—'}</td><td>${it.importe?`${it.moneda==='USD'?'U$S':'$'} ${it.importe}`:'—'}</td></tr>`;}).join('')}
  </tbody></table></div>`).join('')}`;
}

function openFormLote(id) {
  const l=id?DB.lotes.find(x=>x.id===id):null;
  const items=l?.items||[];
  openModal(`<div class="modal modal-lg"><div class="modal-header"><h3>${l?'Editar':'Nuevo'} Lote</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="form-group"><label>Nombre *</label><input id="lNombre" value="${l?.nombre||''}"></div>
    <div class="section-title">Ítems</div>
    <div id="loteItems">${items.map(it=>loteItemHTML(it)).join('')}</div>
    <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="addLoteItem()">+ Ítem</button>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" onclick="saveLote('${id||''}')">Guardar</button></div></div>`);
  setTimeout(()=>{
    const rows=document.querySelectorAll('#loteItems .lote-row');
    rows.forEach((row,i)=>{
      const sels=row.querySelectorAll('select');
      if(sels[0])sels[0].value=items[i]?.proveedorId||'';
      if(sels[1])sels[1].value=items[i]?.rubroId||'';
      if(sels[2])sels[2].value=items[i]?.moneda||'UYU';
    });
  },50);
}

function loteItemHTML(it) {
  const provOpts=(DB.proveedores||[]).map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
  const rubOpts=(DB.rubros||[]).map(r=>`<option value="${r.id}">${r.emoji||''} ${r.nombre}</option>`).join('');
  const s='padding:6px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px';
  return `<div class="lote-row">
    <input style="flex:2;${s.replace('padding:6px','padding:6px 10px')}" placeholder="Concepto" value="${it?.concepto||''}">
    <select style="flex:1.5;${s}"><option value="">Proveedor</option>${provOpts}</select>
    <select style="flex:1.5;${s}"><option value="">Rubro</option>${rubOpts}</select>
    <select style="${s}"><option value="UYU">$</option><option value="USD">U$S</option></select>
    <input type="number" style="flex:1;${s.replace('padding:6px','padding:6px 10px')}" placeholder="Importe" value="${it?.importe||''}">
    <button class="btn btn-danger btn-xs" onclick="this.parentElement.remove()">×</button>
  </div>`;
}

function addLoteItem() { document.getElementById('loteItems').insertAdjacentHTML('beforeend',loteItemHTML(null)); }

async function saveLote(id) {
  const nombre=document.getElementById('lNombre').value.trim();if(!nombre){alert('Nombre obligatorio');return;}
  const rows=document.querySelectorAll('#loteItems .lote-row');
  const items=[];
  rows.forEach(row=>{
    const inputs=row.querySelectorAll('input');const sels=row.querySelectorAll('select');
    const concepto=inputs[0]?.value?.trim();
    if(concepto)items.push({id:uid(),concepto,proveedorId:sels[0]?.value||'',rubroId:sels[1]?.value||'',moneda:sels[2]?.value||'UYU',importe:inputs[1]?.value||''});
  });
  const obj={id:id||uid(),nombre,items};
  if(id){const i=DB.lotes.findIndex(x=>x.id===id);if(i>=0)DB.lotes[i]=obj;}else DB.lotes.push(obj);
  closeModal();await saveDB('lotes');renderLotes();
}

async function aplicarLote(id) {
  const l=DB.lotes.find(x=>x.id===id);if(!l)return;
  const mes=prompt('¿Para qué mes? (YYYY-MM)',new Date().toISOString().slice(0,7));if(!mes)return;
  l.items.forEach(it=>{DB.vencimientos.push({id:uid(),concepto:it.concepto,rubroId:it.rubroId,proveedorId:it.proveedorId,fecha:`${mes}-01`,moneda:it.moneda,importe:it.importe,estado:'',createdAt:new Date().toISOString()});});
  await saveDB('vencimientos');alert(`Lote aplicado: ${l.items.length} vencimientos creados`);showView('agenda');
}

async function deleteLote(id) { confirmDelete('¿Eliminar lote?',async function(){DB.lotes=DB.lotes.filter(x=>x.id!==id);await saveDB('lotes');renderLotes();}); }

// ESTADISTICAS
function renderEstadisticas() {
  const mc=document.getElementById('mainContent');
  mc.innerHTML=`<div class="page-header"><div class="page-title">📊 Estadísticas</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="card"><canvas id="chartEstados" height="220"></canvas></div>
    <div class="card"><canvas id="chartRubros" height="220"></canvas></div>
    <div class="card" style="grid-column:1/-1"><canvas id="chartPagos" height="140"></canvas></div>
  </div>`;
  setTimeout(()=>{
    const venc=DB.vencimientos||[];
    const estados={Vencido:0,Hoy:0,'Próximo':0,'Al día':0,'En gestión':0,Pagado:0};
    venc.forEach(v=>{const e=getEstado(v);const m={vencido:'Vencido',hoy:'Hoy',proximo:'Próximo',ok:'Al día',proceso:'En gestión',pagado:'Pagado'};if(m[e])estados[m[e]]++;});
    new Chart(document.getElementById('chartEstados'),{type:'doughnut',data:{labels:Object.keys(estados),datasets:[{data:Object.values(estados),backgroundColor:['#f55','#f7c948','#f59e42','#3ecf8e','#4f8ef7','#64748b']}]},options:{plugins:{title:{display:true,text:'Por estado',color:'#94a3b8'}}}});
    const byRubro={};
    venc.forEach(v=>{const r=getRubro(v.rubroId);const k=r?r.nombre:'Sin rubro';byRubro[k]=(byRubro[k]||0)+1;});
    new Chart(document.getElementById('chartRubros'),{type:'bar',data:{labels:Object.keys(byRubro),datasets:[{label:'Cant.',data:Object.values(byRubro),backgroundColor:'#4f8ef7'}]},options:{plugins:{title:{display:true,text:'Por rubro',color:'#94a3b8'}},scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}}});
    const meses={};for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);meses[d.toISOString().slice(0,7)]=0;}
    (DB.historial||[]).forEach(h=>{const k=h.fecha?.slice(0,7);if(k&&meses[k]!==undefined)meses[k]+=(parseFloat(h.importe)||0);});
    new Chart(document.getElementById('chartPagos'),{type:'line',data:{labels:Object.keys(meses),datasets:[{label:'Pagos $',data:Object.values(meses),borderColor:'#3ecf8e',backgroundColor:'rgba(62,207,142,.1)',fill:true,tension:.3}]},options:{plugins:{title:{display:true,text:'Pagos últimos 6 meses',color:'#94a3b8'}},scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}}});
  },80);
}

// USUARIOS
function renderUsuarios() {
  if(currentUser?.rol!=='admin'){document.getElementById('mainContent').innerHTML='<div class="empty-state"><div class="icon">🔒</div><p>Solo administradores</p></div>';return;}
  const mc=document.getElementById('mainContent');const users=DB.usuarios||[];
  mc.innerHTML=`<div class="page-header"><div class="page-title">🔑 Usuarios</div><button class="btn btn-primary" onclick="openFormUser()">+ Nuevo</button></div>
  <div class="card"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Acciones</th></tr></thead><tbody>
  ${users.map(u=>`<tr><td>${u.nombre}</td><td>${u.usuario}</td><td><span class="badge ${u.rol==='admin'?'badge-blue':'badge-gray'}">${u.rol}</span></td>
  <td><div style="display:flex;gap:4px"><button class="btn btn-secondary btn-xs" onclick="openFormUser('${u.id}')">✏️</button><button class="btn btn-danger btn-xs" onclick="deleteUser('${u.id}')">🗑️</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
}

function openFormUser(id) {
  const u=id?DB.usuarios.find(x=>x.id===id):null;
  openModal(`<div class="modal" style="max-width:400px"><div class="modal-header"><h3>${u?'Editar':'Nuevo'} Usuario</h3><button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="form-group"><label>Nombre</label><input id="uNombre" value="${u?.nombre||''}"></div>
    <div class="form-group"><label>Usuario</label><input id="uUsuario" value="${u?.usuario||''}"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="uPass"></div>
    <div class="form-group"><label>Rol</label><select id="uRol"><option value="operador" ${u?.rol!=='admin'?'selected':''}>Operador</option><option value="admin" ${u?.rol==='admin'?'selected':''}>Administrador</option></select></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" onclick="saveUser('${id||''}')">Guardar</button></div></div>`);
}

async function saveUser(id) {
  const nombre=document.getElementById('uNombre').value.trim();const usuario=document.getElementById('uUsuario').value.trim();
  if(!nombre||!usuario){alert('Nombre y usuario obligatorios');return;}
  const pass=document.getElementById('uPass').value;
  const obj={id:id||uid(),nombre,usuario,rol:document.getElementById('uRol').value};if(pass)obj.password=pass;
  if(id){const i=DB.usuarios.findIndex(x=>x.id===id);if(i>=0)DB.usuarios[i]={...DB.usuarios[i],...obj};}else DB.usuarios.push(obj);
  closeModal();await saveDB('usuarios');renderUsuarios();
}

async function deleteUser(id) {
  if(id===currentUser?.id){alert('No podés eliminar tu propio usuario');return;}
  confirmDelete('¿Eliminar usuario?',async function(){DB.usuarios=DB.usuarios.filter(x=>x.id!==id);await saveDB('usuarios');renderUsuarios();});
}
