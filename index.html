<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vencimientos Fadentix S.A.</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#171b25;--bg3:#1e2330;--bg4:#252b3b;
  --border:#2a3045;--border2:#344060;
  --accent:#4f8ef7;--accent2:#3a6fd4;--green:#3ecf8e;--red:#f55;--yellow:#f7c948;--orange:#f59e42;--purple:#a78bfa;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --radius:8px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:var(--font);font-size:13px}
input,select,textarea{font-family:var(--font);font-size:13px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:8px 10px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg3)}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:36px;width:100%;max-width:400px}
.login-box h2{font-size:24px;margin-bottom:4px;color:var(--accent)}
.login-box p{color:var(--text2);margin-bottom:28px;font-size:13px}
.login-box label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
.login-box input{width:100%;margin-bottom:4px}
#loginError{color:var(--red);font-size:12px;min-height:18px;margin-top:6px}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 20px;font-weight:600;transition:.2s;width:100%;margin-top:16px;font-size:14px}
.btn-primary:hover{background:var(--accent2)}
.btn-sm{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:5px 12px;transition:.2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(255,85,85,.15);color:var(--red);border:1px solid rgba(255,85,85,.3);border-radius:6px;padding:5px 12px;transition:.2s}
.btn-danger:hover{background:rgba(255,85,85,.25)}
.btn-green{background:rgba(62,207,142,.15);color:var(--green);border:1px solid rgba(62,207,142,.3);border-radius:6px;padding:5px 12px;transition:.2s}
.btn-green:hover{background:rgba(62,207,142,.25)}
.btn-icon{background:none;border:none;padding:4px 8px;color:var(--text2);border-radius:4px;transition:.2s}
.btn-icon:hover{background:var(--bg4);color:var(--text)}

/* SETUP SUPABASE */
#setupScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.setup-box{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:36px;width:100%;max-width:480px}
.setup-box h2{font-size:22px;margin-bottom:6px;color:var(--accent)}
.setup-box p{color:var(--text2);margin-bottom:24px;font-size:13px;line-height:1.6}
.setup-box label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
.setup-box input{width:100%}
#setupError{color:var(--red);font-size:12px;min-height:18px;margin-top:8px}

/* APP SHELL */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.logo span{color:var(--text2);font-weight:400;font-size:13px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{background:none;border:none;color:var(--text2);padding:8px 14px;border-radius:6px;white-space:nowrap;font-size:13px;transition:.2s}
nav button:hover{background:var(--bg3);color:var(--text)}
nav button.active{background:var(--bg4);color:var(--accent);font-weight:600}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.user-badge{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync-dot.off{background:var(--text3)}
main{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto}

/* CARDS & STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .val{font-size:28px;font-weight:700;font-family:var(--mono)}
.stat-card .lbl{font-size:12px;color:var(--text2);margin-top:4px}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=text]{flex:1;min-width:160px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.2s;color:var(--text2)}
.chip:hover{border-color:var(--accent)}
.chip.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}

/* TABLE */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:600;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-red{background:rgba(255,85,85,.15);color:var(--red);border:1px solid rgba(255,85,85,.25)}
.badge-yellow{background:rgba(247,201,72,.15);color:var(--yellow);border:1px solid rgba(247,201,72,.25)}
.badge-green{background:rgba(62,207,142,.15);color:var(--green);border:1px solid rgba(62,207,142,.25)}
.badge-blue{background:rgba(79,142,247,.15);color:var(--accent);border:1px solid rgba(79,142,247,.25)}
.badge-purple{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.badge-gray{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:600px;margin:auto}
.modal-header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:18px;font-weight:600}
.modal-body{padding:20px 24px}
.modal-footer{padding:0 24px 20px;display:flex;justify-content:flex-end;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.form-group label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-section{background:var(--bg3);border-radius:8px;padding:14px;margin-bottom:14px}
.form-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:10px;font-weight:600}
textarea{resize:vertical;min-height:70px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:12px 20px;font-size:13px;z-index:9999;transform:translateY(80px);opacity:0;transition:.3s;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* HISTORIAL inline */
.hist-list{max-height:200px;overflow-y:auto;margin-top:8px}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.hist-item:last-child{border-bottom:none}

/* LOTES */
.lote-card{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:10px}
.lote-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lote-items-list{display:flex;flex-direction:column;gap:6px}
.lote-item-row{display:flex;gap:8px;align-items:center;background:var(--bg4);border-radius:6px;padding:8px}

/* EMOJI PICKER */
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emoji-opt{font-size:22px;cursor:pointer;padding:4px;border-radius:4px;transition:.15s}
.emoji-opt:hover{background:var(--bg4)}
.emoji-opt.selected{background:rgba(79,142,247,.2);outline:1px solid var(--accent)}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  nav button{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>

<!-- SETUP SUPABASE -->
<div id="setupScreen" style="display:flex">
<div class="setup-box">
  <h2>⚙️ Configurar Supabase</h2>
  <p>Ingresá las credenciales de tu proyecto Supabase para habilitar la sincronización en la nube.</p>
  <label>URL del Proyecto</label>
  <input id="setupUrl" type="text" placeholder="https://xxxx.supabase.co">
  <label>Anon Key (sb_publishable_...)</label>
  <input id="setupKey" type="text" placeholder="sb_publishable_...">
  <div id="setupError"></div>
  <button class="btn-primary" onclick="connectSupabase()">Conectar</button>
</div>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none">
<div class="login-box">
  <h2>Vencimientos</h2>
  <p>Fadentix S.A. — Sistema de gestión de vencimientos</p>
  <label>Usuario</label>
  <input id="loginUser" type="text" placeholder="usuario">
  <label>Contraseña</label>
  <input id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
  <div id="loginError"></div>
  <button class="btn-primary" onclick="doLogin()">Ingresar</button>
</div>
</div>

<!-- APP -->
<div id="app">
<header>
  <div class="logo">Vencimientos <span>Fadentix S.A.</span></div>
  <nav id="mainNav">
    <button onclick="showView('agenda')" data-view="agenda">📋 Agenda</button>
    <button onclick="showView('alertas')" data-view="alertas">🔔 Alertas</button>
    <button onclick="showView('historial')" data-view="historial">📜 Historial</button>
    <button onclick="showView('lotes')" data-view="lotes">📦 Lotes</button>
    <button onclick="showView('rubros')" data-view="rubros">🏷️ Rubros</button>
    <button onclick="showView('proveedores')" data-view="proveedores">🏢 Proveedores</button>
    <button onclick="showView('funcionarios')" data-view="funcionarios">👤 Funcionarios</button>
    <button onclick="showView('usuarios')" data-view="usuarios" id="navUsuarios" style="display:none">⚙️ Usuarios</button>
  </nav>
  <div class="header-right">
    <div class="sync-dot off" id="syncDot" title="Sincronización"></div>
    <div class="user-badge" id="userBadge">—</div>
    <button class="btn-sm" onclick="doLogout()">Salir</button>
  </div>
</header>
<main id="mainContent"></main>
</div>

<div id="toast"></div>
<div id="modalContainer"></div>

<script>
// ── CONFIG ──
const SUPABASE_URL_KEY='fadentix_sb_url';
const SUPABASE_KEY_KEY='fadentix_sb_key';
let sbUrl=localStorage.getItem(SUPABASE_URL_KEY)||'';
let sbKey=localStorage.getItem(SUPABASE_KEY_KEY)||'';

let sbClient=null;
let DB={vencimientos:[],rubros:[],proveedores:[],contactos:[],plantillas:[],funcionarios:[],usuarios:[],historial:[],config:{},lotes:[]};
let currentUser=null;
let realtimeChannel=null;

// ── INIT ──
async function initApp(){
  if(!sbUrl||!sbKey){
    document.getElementById('setupScreen').style.display='flex';
    return;
  }
  try{
    sbClient=window.supabase.createClient(sbUrl,sbKey);
    await loadCloudDB();
    ensureDefaults();
    document.getElementById('loginScreen').style.display='flex';
    setupRealtime();
  }catch(e){
    localStorage.removeItem(SUPABASE_URL_KEY);
    localStorage.removeItem(SUPABASE_KEY_KEY);
    sbUrl='';sbKey='';
    document.getElementById('setupScreen').style.display='flex';
  }
}

async function connectSupabase(){
  const url=document.getElementById('setupUrl').value.trim();
  const key=document.getElementById('setupKey').value.trim();
  const errEl=document.getElementById('setupError');
  errEl.textContent='';
  if(!url||!key){errEl.textContent='Completá ambos campos.';return;}
  try{
    const client=window.supabase.createClient(url,key);
    const {error}=await client.from('vm_data').select('key').limit(1);
    if(error&&error.code!=='PGRST116')throw error;
    localStorage.setItem(SUPABASE_URL_KEY,url);
    localStorage.setItem(SUPABASE_KEY_KEY,key);
    sbUrl=url;sbKey=key;
    document.getElementById('setupScreen').style.display='none';
    location.reload();
  }catch(e){
    errEl.textContent='No se pudo conectar: '+e.message;
  }
}

async function loadCloudDB(){
  const {data,error}=await sbClient.from('vm_data').select('key,value');
  if(error)throw error;
  data.forEach(r=>{
    if(DB.hasOwnProperty(r.key))DB[r.key]=r.value||[];
  });
}

async function saveKey(key){
  const val=DB[key];
  await sbClient.from('vm_data').upsert({key,value:val},{onConflict:'key'});
}

function ensureDefaults(){
  if(!DB.rubros||!DB.rubros.length)DB.rubros=[
    {id:'r1',nombre:'Impuestos',emoji:'🏛️',tipo:'impuesto',diasAlerta:10,descripcion:''},
    {id:'r2',nombre:'Servicios',emoji:'⚡',tipo:'servicio',diasAlerta:5,descripcion:''},
    {id:'r3',nombre:'Seguros',emoji:'🛡️',tipo:'seguro',diasAlerta:7,descripcion:''},
    {id:'r4',nombre:'Alquileres',emoji:'🏠',tipo:'alquiler',diasAlerta:5,descripcion:''},
    {id:'r5',nombre:'Bancario',emoji:'🏦',tipo:'bancario',diasAlerta:3,descripcion:''},
  ];
  if(!DB.usuarios||!DB.usuarios.length)DB.usuarios=[
    {id:'u1',usuario:'admin',pass:'admin123',rol:'admin',nombre:'Administrador'},
    {id:'u2',usuario:'operador',pass:'op123',rol:'operador',nombre:'Operador'},
  ];
  if(!DB.config||typeof DB.config!=='object'||Array.isArray(DB.config))DB.config={diasAlerta:5,empresa:'Fadentix S.A.'};
  if(!DB.lotes)DB.lotes=[];
  if(!DB.historial)DB.historial=[];
  if(!DB.vencimientos)DB.vencimientos=[];
  if(!DB.proveedores)DB.proveedores=[];
  if(!DB.funcionarios)DB.funcionarios=[];
  if(!DB.contactos)DB.contactos=[];
  if(!DB.plantillas)DB.plantillas=[];
}

function setupRealtime(){
  if(realtimeChannel)sbClient.removeChannel(realtimeChannel);
  realtimeChannel=sbClient.channel('vm_realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'vm_data'},async(payload)=>{
      const k=payload.new?.key||payload.old?.key;
      if(k&&DB.hasOwnProperty(k)){
        const {data}=await sbClient.from('vm_data').select('value').eq('key',k).single();
        if(data)DB[k]=data.value||[];
        refreshCurrentView();
      }
    })
    .subscribe(status=>{
      const dot=document.getElementById('syncDot');
      if(status==='SUBSCRIBED'){dot.classList.remove('off');dot.title='Sincronizado';}
      else{dot.classList.add('off');dot.title='Sin conexión';}
    });
}

// ── LOGIN ──
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  const found=DB.usuarios.find(x=>x.usuario===u&&x.pass===p);
  if(!found){errEl.textContent='Usuario o contraseña incorrectos.';return;}
  currentUser=found;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('userBadge').textContent=found.nombre||found.usuario;
  if(found.rol==='admin')document.getElementById('navUsuarios').style.display='';
  showView('agenda');
}

function doLogout(){
  currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

// ── NAVIGATION ──
let currentView='agenda';
function showView(v){
  currentView=v;
  document.querySelectorAll('nav button').forEach(b=>{
    b.classList.toggle('active',b.dataset.view===v);
  });
  const renders={agenda:renderAgenda,alertas:renderAlertas,historial:renderHistorial,lotes:renderLotes,rubros:renderRubros,proveedores:renderProveedores,contactos:renderContactos,funcionarios:renderFuncionarios,usuarios:renderUsuarios};
  if(renders[v])renders[v]();
}
function refreshCurrentView(){showView(currentView);}

// ── TOAST ──
let toastT;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type==='err'?'err':'ok');
  clearTimeout(toastT);toastT=setTimeout(()=>{el.className='';},3000);
}

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function fmt(d){if(!d)return'—';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric'});}
function diasHasta(d){if(!d)return null;const h=new Date(d+'T12:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((h-n)/86400000);}
function estadoBadge(v){
  if(v.estado==='pagado')return'<span class="badge badge-green">✓ Pagado</span>';
  if(v.estado==='en_proceso')return'<span class="badge badge-purple">⟳ En proceso</span>';
  const d=diasHasta(v.fecha);
  if(d===null)return'<span class="badge badge-gray">Sin fecha</span>';
  if(d<0)return'<span class="badge badge-red">Vencido '+Math.abs(d)+'d</span>';
  if(d===0)return'<span class="badge badge-red">⚠ Hoy</span>';
  const alerta=parseInt((DB.rubros.find(r=>r.id===v.rubroId)||{}).diasAlerta||DB.config.diasAlerta||5);
  if(d<=alerta)return`<span class="badge badge-yellow">⚠ ${d}d</span>`;
  return`<span class="badge badge-blue">${d}d</span>`;
}
function monedaLabel(m){return m==='usd'?'U$S':'$ UYU';}
function formatMonto(m,mon){
  if(!m&&m!==0)return'—';
  const s=parseFloat(m).toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
  return(mon==='usd'?'U$S ':'$ ')+s;
}

// ── AGENDA ──
let agendaSearch='';
let agendaRubros=[];
let agendaEstado='todos';

function renderAgenda(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const total=DB.vencimientos.length;
  const vencidos=DB.vencimientos.filter(v=>v.estado!=='pagado'&&v.estado!=='en_proceso'&&v.fecha&&diasHasta(v.fecha)<0).length;
  const proximos=DB.vencimientos.filter(v=>{
    if(v.estado==='pagado'||v.estado==='en_proceso')return false;
    const d=diasHasta(v.fecha);
    const alerta=parseInt((DB.rubros.find(r=>r.id===v.rubroId)||{}).diasAlerta||DB.config.diasAlerta||5);
    return d!==null&&d>=0&&d<=alerta;
  }).length;
  const pagados=DB.vencimientos.filter(v=>v.estado==='pagado').length;

  const rubrosUsados=[...new Set(DB.vencimientos.map(v=>v.rubroId).filter(Boolean))];
  const chipsHTML=rubrosUsados.map(rid=>{
    const r=DB.rubros.find(x=>x.id===rid);
    if(!r)return'';
    const active=agendaRubros.includes(rid);
    return`<span class="chip${active?' active':''}" onclick="toggleRubroFilter('${rid}')">${r.emoji||'🏷️'} ${r.nombre}</span>`;
  }).join('');

  document.getElementById('mainContent').innerHTML=`
  <div class="stats-row">
    <div class="stat-card"><div class="val">${total}</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="val" style="color:var(--red)">${vencidos}</div><div class="lbl">Vencidos</div></div>

  </div>

    <input type="text" placeholder="🔍 Buscar..." value="${agendaSearch}" oninput="agendaSearch=this.value;renderAgenda()" style="flex:1;min-width:160px">
    <select onchange="agendaEstado=this.value;renderAgenda()">
      <option value="todos" ${agendaEstado==='todos'?'selected':''}>Todos los estados</option>
      <option value="pendiente" ${agendaEstado==='pendiente'?'selected':''}>Pendientes</option>
      <option value="en_proceso" ${agendaEstado==='en_proceso'?'selected':''}>En proceso</option>
      <option value="pagado" ${agendaEstado==='pagado'?'selected':''}>Pagados</option>
    </select>
    <button class="btn-primary" onclick="openVencimientoModal()">+ Nuevo</button>
  </div>
  ${chipsHTML?`<div class="filter-chips">${chipsHTML}</div>`:''}
  <div class="table-wrap">
  <table>
    <thead><tr>
      <th>Concepto</th><th>Rubro</th><th>Proveedor</th><th>Fecha</th><th>Monto</th><th>Estado</th><th>Acciones</th>
    </tr></thead>
    <tbody id="agendaTbody"></tbody>
  </table>
  </div>`;

  const filtered=DB.vencimientos.filter(v=>{
    const s=agendaSearch.toLowerCase();
    if(s&&!v.concepto?.toLowerCase().includes(s)){
      const p=DB.proveedores.find(x=>x.id===v.proveedorId);
      if(!p?.nombre.toLowerCase().includes(s))return false;
    }
    if(agendaRubros.length&&!agendaRubros.includes(v.rubroId))return false;
    if(agendaEstado!=='todos'&&v.estado!==agendaEstado)return false;
    return true;
  }).sort((a,b)=>{
    if(a.estado==='pagado'&&b.estado!=='pagado')return 1;
    if(b.estado==='pagado'&&a.estado!=='pagado')return -1;
    if(!a.fecha)return 1;if(!b.fecha)return -1;
    return new Date(a.fecha)-new Date(b.fecha);
  });

  const tbody=document.getElementById('agendaTbody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="7"><div class="empty-state">No hay vencimientos</div></td></tr>';return;}
  tbody.innerHTML=filtered.map(v=>{
    const r=DB.rubros.find(x=>x.id===v.rubroId);
    const p=DB.proveedores.find(x=>x.id===v.proveedorId);
    return`<tr>
      <td><strong>${v.concepto||'—'}</strong>${v.plazo?`<br><small style="color:var(--text3)">${v.plazo==='en_proceso'?'En proceso':v.plazo+' días'}</small>`:''}</td>
      <td>${r?`${r.emoji||'🏷️'} ${r.nombre}`:'—'}</td>
      <td>${p?p.nombre:'—'}${p?.nInterno?`<br><small style="color:var(--text3)">N°${p.nInterno}</small>`:''}</td>
      <td style="font-family:var(--mono);font-size:12px">${v.estado==='en_proceso'?'<span style="color:var(--purple)">En proceso</span>':fmt(v.fecha)}</td>
      <td style="font-family:var(--mono)">${formatMonto(v.monto,v.moneda)}</td>
      <td>${estadoBadge(v)}</td>
      <td>
        <button class="btn-icon" onclick="openVencimientoModal('${v.id}')" title="Editar">✏️</button>
        ${v.estado!=='pagado'?`<button class="btn-icon" onclick="pagarVencimiento('${v.id}')" title="Registrar pago">💰</button>`:''}
        ${v.contactoId||DB.contactos.find(c=>c.proveedorId===v.proveedorId)?`<button class="btn-icon" onclick="enviarWhatsApp('${v.id}')" title="WhatsApp">💬</button>`:''}
        <button class="btn-icon" onclick="deleteVencimiento('${v.id}')" title="Eliminar">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

function toggleFechaByPlazo(){
  const p=document.getElementById('fPlazo')?.value;

  if(g)g.style.opacity=p==='en_proceso'?'0.4':'1';
}

async function saveVencimiento(id){
  const concepto=document.getElementById('fConcepto').value.trim();
  if(!concepto){toast('Ingresá un concepto','err');return;}
  const plazo=document.getElementById('fPlazo').value;
  const obj={
    id:id||uid(),
    concepto,
    rubroId:document.getElementById('fRubro').value,
    proveedorId:document.getElementById('fProv').value,
    contactoId:document.getElementById('fContacto').value,
    plazo,
    fecha:plazo==='en_proceso'?null:document.getElementById('fFecha').value,
    monto:parseFloat(document.getElementById('fMonto').value)||null,
    moneda:document.getElementById('fMoneda').value,
    estado:document.getElementById('fEstado').value,
    notas:document.getElementById('fNotas').value,
  };
  if(id){
    const i=DB.vencimientos.findIndex(x=>x.id===id);
    if(i>=0)DB.vencimientos[i]={...DB.vencimientos[i],...obj};
  }else{
    DB.vencimientos.push(obj);
  }
  await saveKey('vencimientos');
  closeModal();toast('Vencimiento guardado');renderAgenda();
}

async function pagarVencimiento(id){
  const v=DB.vencimientos.find(x=>x.id===id);
  if(!v)return;
  const reg={
    id:uid(),vencimientoId:id,
    fecha:new Date().toISOString().slice(0,10),
    monto:v.monto,moneda:v.moneda,
    usuario:currentUser?.nombre||currentUser?.usuario||'—'
  };
  DB.historial.push(reg);
  // renovar si tiene plazo
  if(v.plazo&&v.plazo!=='en_proceso'&&v.fecha){
    const nf=new Date(v.fecha+'T12:00:00');
    nf.setDate(nf.getDate()+parseInt(v.plazo));
    v.fecha=nf.toISOString().slice(0,10);
    v.estado='pendiente';
  }else{
    v.estado='pagado';
  }
  await saveKey('vencimientos');
  await saveKey('historial');
  toast('Pago registrado ✓');renderAgenda();
}

async function deleteVencimiento(id){
  if(!confirm('¿Eliminar este vencimiento?'))return;
  DB.vencimientos=DB.vencimientos.filter(x=>x.id!==id);
  await saveKey('vencimientos');
  toast('Eliminado');renderAgenda();
}

// ── WHATSAPP ──
function enviarWhatsApp(vid){
  const v=DB.vencimientos.find(x=>x.id===vid);
  if(!v)return;
  let contacto=null;
  if(v.contactoId)contacto=DB.contactos.find(c=>c.id===v.contactoId);
  if(!contacto&&v.proveedorId)contacto=DB.contactos.find(c=>c.proveedorId===v.proveedorId);
  if(!contacto){toast('No hay contacto asignado','err');return;}
  let tel=contacto.telefono||'';
  tel=tel.replace(/\D/g,'');
  if(tel.startsWith('0'))tel='598'+tel.slice(1);
  if(!tel.startsWith('598')&&tel.length<=9)tel='598'+tel;
  const d=diasHasta(v.fecha);
  const msg=`Estimado/a ${contacto.nombre}, le recordamos el vencimiento de *${v.concepto}* `+
    (v.fecha?`con fecha ${fmt(v.fecha)} `:'')+(d!==null&&d>=0?`(en ${d} días) `:d<0?`(venció hace ${Math.abs(d)} días) `:'')+
    (v.monto?`por un monto de ${formatMonto(v.monto,v.moneda)} `:'')+'.\nGracias.';
  window.open('https://web.whatsapp.com/send?phone='+tel+'&text='+encodeURIComponent(msg),'_blank');
}

function renderAlertas(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const alerts=DB.vencimientos.filter(v=>{
    if(v.estado==='pagado')return false;
    if(v.estado==='en_proceso')return true;
    const d=diasHasta(v.fecha);
    if(d===null)return false;
    const alerta=parseInt((DB.rubros.find(r=>r.id===v.rubroId)||{}).diasAlerta||DB.config.diasAlerta||5);

    if(a.estado==='en_proceso')return 1;

  document.getElementById('mainContent').innerHTML=`

      const r=DB.rubros.find(x=>x.id===v.rubroId);
      const p=DB.proveedores.find(x=>x.id===v.proveedorId);
      return`<tr>
        <td><strong>${v.concepto}</strong></td>
        <td>${r?r.emoji+' '+r.nombre:'—'}</td>
        <td>${p?p.nombre:'—'}</td>
        <td style="font-family:var(--mono);font-size:12px">${v.estado==='en_proceso'?'<span style="color:var(--purple)">En proceso</span>':fmt(v.fecha)}</td>
        <td style="font-family:var(--mono)">${formatMonto(v.monto,v.moneda)}</td>
        <td>${estadoBadge(v)}</td>
        <td>
          ${v.estado!=='pagado'?`<button class="btn-icon" onclick="pagarVencimiento('${v.id}')">💰</button>`:''}
          ${(v.contactoId||DB.contactos.find(c=>c.proveedorId===v.proveedorId))?`<button class="btn-icon" onclick="enviarWhatsApp('${v.id}')">💬</button>`:''}

    }).join(''):'<tr><td colspan="7"><div class="empty-state">No hay alertas activas 🎉</div></td></tr>'}</tbody>

async function saveLote(id){
  const nombre=document.getElementById('lNombre').value.trim();
  if(!nombre){toast('Ingresá un nombre','err');return;}
  const c=document.getElementById('loteItemsContainer');
  const items=[];
  c.querySelectorAll('.lote-item-row').forEach((row,i)=>{
    const lic=row.querySelector('[id^="lic_"]');
    const lir=row.querySelector('[id^="lir_"]');
    const lip=row.querySelector('[id^="lip_"]');
    const lim=row.querySelector('[id^="lim_"]');
    const limon=row.querySelector('[id^="limon_"]');
    if(lic?.value)items.push({concepto:lic.value,rubroId:lir?.value,proveedorId:lip?.value,monto:parseFloat(lim?.value)||null,moneda:limon?.value||'uyu'});
  });
  const obj={id:id||uid(),nombre,items};
  if(id){const i=DB.lotes.findIndex(x=>x.id===id);if(i>=0)DB.lotes[i]=obj;}
  else DB.lotes.push(obj);
  await saveKey('lotes');closeModal();toast('Lote guardado');renderLotes();
}

async function aplicarLote(id){
  const l=DB.lotes.find(x=>x.id===id);
  if(!l||!l.items?.length){toast('Lote sin ítems','err');return;}
  const hoy=new Date();
  const mesNom=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][hoy.getMonth()];
  const año=hoy.getFullYear();

  const itemsHTML=l.items.map((it,i)=>`
    <div class="lote-item-row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px" id="ai_${i}">
      <span style="flex:1;font-size:13px">${it.concepto}</span>
      <input type="date" id="aif_${i}" value="${hoy.toISOString().slice(0,10)}" style="width:130px">

async function confirmarAplicarLote(id){
  const l=DB.lotes.find(x=>x.id===id);
  if(!l)return;
  l.items.forEach((it,i)=>{
    const fecha=document.getElementById('aif_'+i)?.value||null;
    const monto=parseFloat(document.getElementById('aim_'+i)?.value)||it.monto||null;
    const moneda=document.getElementById('aimon_'+i)?.value||it.moneda||'uyu';
    DB.vencimientos.push({id:uid(),concepto:it.concepto,rubroId:it.rubroId,proveedorId:it.proveedorId,fecha,monto,moneda,estado:'pendiente',plazo:''});

async function saveUser(id){
  const usuario=document.getElementById('uUser').value.trim();
  if(!usuario){toast('Ingresá un usuario','err');return;}
  const pass=document.getElementById('uPass').value;
  const obj={id:id||uid(),usuario,nombre:document.getElementById('uNombre').value,rol:document.getElementById('uRol').value};
  if(pass)obj.pass=pass;
  if(id){
    const i=DB.usuarios.findIndex(x=>x.id===id);
    if(i>=0)DB.usuarios[i]={...DB.usuarios[i],...obj};
  }else DB.usuarios.push(obj);
  await saveKey('usuarios');closeModal();toast('Usuario guardado');renderUsuarios();
}

async function deleteUser(id){
  if(!confirm('¿Eliminar usuario?'))return;
  DB.usuarios=DB.usuarios.filter(x=>x.id!==id);
  await saveKey('usuarios');toast('Eliminado');renderUsuarios();
}

// ── MODAL HELPER ──
function showModal(html,tall=false){
  const c=document.getElementById('modalContainer');
  c.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="${tall?'max-width:640px':''}">${html}</div></div>`;
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}

window.addEventListener('DOMContentLoaded',initApp);
</script>
